name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  sqlite:
    name: SQLite / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run SQLite tests
        env:
          TEST_DB_DRIVER: sqlite
        run: vendor/bin/phpunit --testsuite sqlite

  sqlite-lowest:
    name: SQLite / PHP 8.2 / lowest dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install lowest compatible dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction

      - name: Run SQLite tests
        env:
          TEST_DB_DRIVER: sqlite
        run: vendor/bin/phpunit --testsuite sqlite

  mysql:
    name: MySQL / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: objectiveweb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run MySQL tests
        env:
          TEST_DB_DRIVER: mysql
          MYSQL_TEST_DSN: mysql:dbname=objectiveweb_test;host=127.0.0.1;port=3306;charset=utf8mb4
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: root
        run: vendor/bin/phpunit --testsuite mysql

  pgsql:
    name: PostgreSQL / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: objectiveweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d objectiveweb_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run PostgreSQL tests
        env:
          TEST_DB_DRIVER: pgsql
          PGSQL_TEST_DSN: pgsql:dbname=objectiveweb_test;host=127.0.0.1;port=5432
          PGSQL_TEST_USER: postgres
          PGSQL_TEST_PASSWORD: postgres
        run: vendor/bin/phpunit --testsuite pgsql
