version: 1
name: DB
api_root: http://localhost:8087/api
openapi: openapi.yaml
components:
  source: components
  output: public/components
canvas:
  - id: overview
    name: Overview
    items:
      - resource: { type: component, ref: db-list }
        x: -560
        y: -360
        width: 360
        height: 320
      - resource: { type: operation, id: op-list-databases }
        x: -540
        y: 40
        width: 360
        height: 190

      - resource: { type: component, ref: db-table-list }
        x: -80
        y: -360
        width: 520
        height: 420
      - resource: { type: operation, id: op-list-tables }
        x: -20
        y: 140
        width: 400
        height: 200

      - resource: { type: component, ref: db-table-schema }
        x: 560
        y: -440
        width: 720
        height: 500
      - resource: { type: operation, id: op-get-table-schema }
        x: 700
        y: 140
        width: 440
        height: 210

      - resource: { type: component, ref: db-table-rows }
        x: 1420
        y: -440
        width: 760
        height: 520
      - resource: { type: operation, id: op-list-rows }
        x: 1580
        y: 160
        width: 440
        height: 230

      - resource: { type: component, ref: db-row-details }
        x: 520
        y: 560
        width: 560
        height: 440
      - resource: { type: operation, id: op-get-row }
        x: 600
        y: 1080
        width: 420
        height: 210

      - resource: { type: component, ref: db-row-editor }
        x: 1220
        y: 560
        width: 620
        height: 560
      - resource: { type: operation, id: op-update-row }
        x: 1320
        y: 1200
        width: 420
        height: 220
