version: 1
name: DB
api_root: http://localhost:8087/api
openapi: openapi.yaml
components:
  source: components
  output: public/components
canvas:
  - id: overview
    name: Overview
    items:
      - resource: { type: component, ref: db-list }
        x: -620
        y: -360
        width: 360
        height: 320
        on:
          open:
            - target: db-table-list
              properties:
                dbName: { from: event.resource.name }
      - resource: { type: operation, id: op-list-databases }
        x: -600
        y: 40
        width: 360
        height: 190

      - resource: { type: component, ref: db-table-list }
        x: -120
        y: -360
        width: 520
        height: 420
        on:
          open:
            - target: db-table-schema
              properties:
                dbName: { from: source.dbName }
                tableName: { from: event.resource.name }
            - target: db-table-rows
              properties:
                dbName: { from: source.dbName }
                tableName: { from: event.resource.name }
                primaryKey: { from: event.resource.primaryKey, default: id }
                writable: { from: event.resource.writable, default: false }
      - resource: { type: operation, id: op-list-tables }
        x: -60
        y: 140
        width: 400
        height: 200

      - resource: { type: component, ref: db-table-schema }
        x: 560
        y: -440
        width: 720
        height: 500
      - resource: { type: operation, id: op-get-table-schema }
        x: 700
        y: 140
        width: 440
        height: 210

      - resource: { type: component, ref: db-table-rows }
        x: 1420
        y: -440
        width: 760
        height: 520
        on:
          edit:
            - target: db-row-editor
              properties:
                dbName: { from: source.dbName }
                tableName: { from: source.tableName }
                id: { from: "event.resource[source.primaryKey]" }
      - resource: { type: operation, id: op-list-rows }
        x: 1580
        y: 160
        width: 440
        height: 230

      - resource: { type: component, ref: db-row-editor }
        x: 1040
        y: 620
        width: 680
        height: 580
      - resource: { type: operation, id: op-get-row }
        x: 860
        y: 1280
        width: 420
        height: 210
      - resource: { type: operation, id: op-update-row }
        x: 1480
        y: 1280
        width: 420
        height: 220
