<title>Database Rows</title>
<component-property name="resource" type="object" context></component-property>
<component-property name="viewable" type="boolean"></component-property>
<component-property name="editable" type="boolean"></component-property>
<component-property name="deletable" type="boolean"></component-property>

<data-table
  .resource=${resource?.data || []}
  .actions=${[
    viewable ? { name: 'db-view-row', label: 'View' } : null,
    editable ? { name: 'db-edit-row', label: 'Edit' } : null,
    deletable ? { name: 'db-delete-row', label: 'Delete', className: 'danger' } : null
  ].filter(Boolean)}
></data-table>
<p class="count">${resource?.total ?? 0} rows</p>
