<title>Database Table Rows</title>
<component-property name="dbName" type="string" required example="app"></component-property>
<component-property name="tableName" type="string" required example="users"></component-property>

<data-source
  .key=${`db:${dbName}:${tableName}:schema`}
  .resource=${() => api.getTableSchema({ path: { dbName, tableName } })}
>
  <db-table-row-data .dbName=${dbName} .tableName=${tableName}></db-table-row-data>
</data-source>
