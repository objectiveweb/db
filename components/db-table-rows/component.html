<title>Table Rows</title>
<component-property name="dbName" type="string" required example="app"></component-property>
<component-property name="tableName" type="string" required example="users"></component-property>
<component-property name="primaryKey" type="string" example="id"></component-property>
<component-property name="writable" type="boolean" example="true"></component-property>

<header class="component-heading"><strong>${dbName}.${tableName}</strong></header>
<data-table
  .resource=${Promise.resolve(api.listRows({ path: { dbName, tableName } })).then(page => page?.data || [])}
  .actions=${writable ? [{ name: 'edit-row', label: 'Edit' }] : []}
  @edit-row=${event => {
    const id = resolveRowId(event.detail.resource, primaryKey);
    if (id) navigate('db-row-editor', { dbName, tableName, id });
  }}
></data-table>
