<title>Row Details</title>
<component-property name="dbName" type="string" required example="app"></component-property>
<component-property name="tableName" type="string" required example="users"></component-property>
<component-property name="id" type="string" required example="1"></component-property>
<component-property name="primaryKey" type="string" example="id"></component-property>
<component-property name="writable" type="boolean" example="true"></component-property>

<header class="component-heading"><strong>${dbName}.${tableName} #${id}</strong></header>
<data-table
  .resource=${Promise.resolve(api.getRow({ path: { dbName, tableName, id } })).then(row => rowFields(row))}
>
  <table>
    <thead><tr><th>Field</th><th>Value</th></tr></thead>
    <tbody>
      <template data-row>
        <tr>
          <th><data-label field="field"></data-label></th>
          <td><data-label field="value"></data-label></td>
        </tr>
      </template>
    </tbody>
  </table>
</data-table>
<div class="toolbar">
  ${writable ? html`<button type="button" @click=${() => navigate('db-row-editor', { dbName, tableName, id, primaryKey, writable })}>Edit</button>` : ''}
  <button type="button" @click=${() => navigate('db-table-rows', { dbName, tableName, primaryKey, writable })}>Back to rows</button>
</div>
